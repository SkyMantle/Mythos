sdr:
  driver: bladerf # bladerf | file (відтворення запису) | sim
  device: '' # порожньо = перша знайдена плата; або "*:serial=abcd1234"
  lib_path: '' # порожньо = шукати автоматично; або точний шлях до bladeRF.dll
  rx_channel: 0 # 0 = RX1, 1 = RX2
  quick_tune: false # профілі швидкої перебудови; звір через bench_retune.py
  num_buffers: 32 # потік USB: більше буферів = стійкіше до зривів,
  buffer_size: 32768 # але більша затримка. buffer_size кратний 1024
  num_transfers: 16
  gain_db: 35 # почни з 30 і підбери через scripts/bringup.py
  bias_tee: true
  agc: false # АРП зручна для пошуку, шкідлива для декодування
  settle_us: 500 # час установлення ФАПЧ після перебудови
  # driver: file
  # path: caps/vtx.cf32
  bias_tee_gain_offset_db: 15

scan:
  start_hz: 400.0e6
  stop_hz: 6000.0e6
  sample_rate: 35.0e6 # bladeRF A4 тягне до 61.44, але 40 стабільніше по USB
  channel_bw_hz: 10.0e6 # очікувана ширина каналу; визначає крок свіпу
  step_hz: 0 # 0 = порахувати автоматично зі смуги і ширини каналу
  fft_size: 8192
  averages: 8
  threshold_db: 5.0 # наскільки сигнал має піднятись над шумовою підлогою
  min_bw_hz: 6.0e6 # вужче 6 МГц — шпори 2.7/4–5 МГц, не аналогове FPV
  inspect_ms: 40 # довше, щоб димова перевірка decode() встигла зловити кадр
  inspect_bw_hz: 12.0e6 # вікно класифікації; не розширювати MERGE_TOL
  dc_notch_hz: 200.0e3 # ширина вирізу на нулі (витік гетеродина)
  priority_bands: false # частіше обходити 433/900/1G2/2G4/3G3/5G8
  confirm_hits: 2
  line_tol_hz: 150.0 # допуск рядкової частоти від номіналу PAL/NTSC
  line_prominence_db: 10.0 # наскільки лінія має бути вища за фон
  min_confidence: 0.45 # поріг ухвалення за рядковою лінією
  min_harmonics: 1 # без гребінця гармонік рядок — вузька завада, не відео
  inspect_decode: true # коротке cvbs.decode перед списком (проти хибних спрацювань)
  inspect_min_row_corr: 0.12 # схожість сусідніх рядків; шум/сніг дає ~0
  inspect_require_lock: false # 40 мс INSPECT часто не ловить кадрову; фільтр — corr
  inspect_min_lines: 80 # мінімум рядків у димовому кадрі
  inspect_offsets_mhz: [1.0, 2.0] # цифрові зсуви: центр зайнятості ≠ центр відео
  merge_smear_hz: 32.0e6 # ЧМ-пляма на 5 ГГц розмазується по кроках свіпу
  debug_candidates: false
  auto_peek: true # автоматично зазирати на щойно знайдений канал
  auto_peek_secs: 5 # скільки секунд показувати
  auto_peek_min_conf: 0.6 # знизу якої впевненості не відволікатись
  auto_peek_cooldown_s: 60 # не повертатись на той самий канал частіше

video:
  sample_rate: 20.0e6 # LOCK вужчий за свіп: менше USB і дешевша обробка
  deviation_hz: 10.0e6
  channel_bw_hz: 10.0e6 # очікувана зайнята смуга каналу
  lo_offset_hz: 0.0 # зміщення ФАПЧ від центру каналу; для 5.8 ГГц
  # при sample_rate 61.44e6 постав 8.0e6
  afc: true # автопідстроювання: лише цифровий зсув каналайзера
  afc_gain: 0.7 # частка похибки, що виправляється за крок
  afc_limit_hz: 20.0e+6 # стеля |afc|; реально ріже запас Найквіста
  afc_deadband_hz: 80.0e+3 # нижче цієї похибки не смикаємось
  afc_max_step_hz: 0.8e+6 # стеля одного кроку цифрової поправки
  afc_digital_headroom_hz: 1.5e+6 # запас Найквіста під цифрову AFC
  capture_ms: 56 # скільки ефіру беремо на кадр до трекінгу (трекінг ріже вікно)
  stream_quality: 82 # якість WebP для потоку в браузер
  stream_method: 0 # WebP method: 0 найшвидший, 4 найякісніший
  rec_fps: 24 # частота кадрів у файлі
  rec_height: 288 # висота запису; менше = менший файл
  rec_crf: 24 # якість H.264: менше число = краще і більше
  rec_preset: veryfast # на Pi 5 не важче за veryfast
  idle_ms: 0 # пауза між кадрами стелила б fps; 0 = без штучної стелі
  track_window_margin: 1.25 # скільки полів беремо в трекінгу (було 1.7)
  width: 640
  spectrum_every: 16 # спектр у LOCK лише індикація — рідше = більше fps
  hunt: true # у LOCK дрібний цифровий пошук, де картинка краща
  hunt_every: 20 # кадрів між спробами; сам пошук — у фоновій нитці
  hunt_after_lock: 16 # після кліку частіше шукаємо перші N кадрів
  hunt_offsets_mhz: [0.25] # ±0.25 МГц цифра; lock_target не рухаємо
  hunt_min_gain: 0.10 # наскільки оцінка має зрости, щоб прийняти зсув
  hunt_skip_if_score: 0.70 # якщо вже добре — не витрачати CPU
  ffmpeg_path: ''
  average: 5 # часове усереднення: більше = менше шуму, але й повільніша
  # реакція. Тепер воно рухомо-адаптивне: сильно усереднює нерухомий фон
  # і не чіпає рух/краї, тож змазування руху й роздвоєння тексту зникли.
  motion_thresh: 24.0 # поріг «руху» (рівні 0..255): нижче — сильніше усереднення
  auto_levels: true # авторозтяг контрасту за перцентилями кадру (проти «сірої» картинки)
  sharpen: 0.5 # горизонтальна апертурна корекція: 0 — вимк., 0.4-0.8 — помірно
  ring_seconds: 0.5

web:
  host: 0.0.0.0
  port: 8080
